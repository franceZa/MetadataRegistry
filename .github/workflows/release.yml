name: Release (push master)

on:
  push:
    branches: [master]
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build & verify release package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (exact SHA)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --locked

      - name: Validate DataContracts
        run: uv run mdf validate

      - name: Compile resolved configs
        run: uv run mdf compile --env dev

      - name: Build release package (gated)
        run: uv run mdf package --env dev --release

      - name: Verify package integrity
        run: uv run mdf verify-package build/dev/release

      - name: Run test suite
        run: uv run pytest

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdf-release-${{ github.sha }}
          path: build/dev/release
          retention-days: 30

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-verify
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout (exact SHA)
        uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: mdf-release-${{ github.sha }}
          path: build/dev/release

      - name: Verify downloaded package
        run: |
          uv run mdf verify-package build/dev/release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "mdf ${{ github.ref_name }}" \
            --generate-notes \
            build/dev/release/*
