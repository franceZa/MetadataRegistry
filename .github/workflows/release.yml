name: Release (push master)

# FR-L.1 / A-18: every push to master publishes GitHub Release `mdf-<sha12>`.
# Idempotent: an existing release with identical content is skipped; different content fails.
on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build & verify release package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}
      delivery_mode: ${{ steps.meta.outputs.delivery_mode }}
    steps:
      - name: Checkout (exact SHA)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --locked

      - name: Validate DataContracts
        run: uv run mdf validate

      # Tests rebuild build/dev/release as a preview package, so they must run
      # BEFORE the release package is built (otherwise the artifact is preview).
      - name: Run test suite
        run: uv run pytest

      - name: Compile resolved configs
        run: uv run mdf compile --env dev

      - name: Build release package (gated)
        run: uv run mdf package --env dev --release

      - name: Verify package integrity and release_id
        run: uv run mdf verify-package build/dev/release --expect-release-id "mdf-${GITHUB_SHA::12}"

      - name: Read release metadata
        id: meta
        run: |
          test "$(jq -r '.preview' build/dev/release/manifest.json)" = "false"
          echo "release_id=$(jq -r '.release_id' build/dev/release/manifest.json)" >> "$GITHUB_OUTPUT"
          # FR-L.12: delivery mode comes from the control file (validated by `mdf validate` above)
          echo "delivery_mode=$(uv run python -c "import yaml;print(yaml.safe_load(open('config/env/dev.yaml',encoding='utf-8'))['delivery_mode'])")" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: mdf-release-${{ github.sha }}
          path: build/dev/release
          retention-days: 30

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    env:
      RELEASE_ID: ${{ needs.build-and-verify.outputs.release_id }}
    steps:
      - name: Checkout (exact SHA)
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --locked

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: mdf-release-${{ github.sha }}
          path: build/dev/release

      - name: Verify downloaded package
        run: |
          test "$RELEASE_ID" = "mdf-${GITHUB_SHA::12}"
          uv run mdf verify-package build/dev/release --expect-release-id "$RELEASE_ID"
          test "$(jq -r '.preview' build/dev/release/manifest.json)" = "false"

      - name: Publish or skip if identical release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            mkdir -p build/existing
            gh release download "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" --dir build/existing
            uv run mdf verify-package build/existing --expect-release-id "$RELEASE_ID"
            # ci_run_url differs between runs of the same commit; everything else must match.
            if ! diff <(jq -S 'del(.ci_run_url)' build/existing/manifest.json) \
                      <(jq -S 'del(.ci_run_url)' build/dev/release/manifest.json); then
              echo "::error::release $RELEASE_ID exists with different content"
              exit 1
            fi
            echo "release $RELEASE_ID already published with identical content - skip"
            exit 0
          fi
          gh release create "$RELEASE_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_ID" \
            --notes "mdf release package for ${GITHUB_SHA}" \
            build/dev/release/*

      # T-45 · FR-L.14 (ก): tell the user what to do next for the configured delivery_mode.
      - name: Next steps (job summary)
        env:
          DELIVERY_MODE: ${{ needs.build-and-verify.outputs.delivery_mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run python scripts/next_steps.py "$DELIVERY_MODE" "$RELEASE_ID" \
            --run-url "$RUN_URL" --repo "$GITHUB_REPOSITORY" | tee -a "$GITHUB_STEP_SUMMARY"

  # T-40/T-43 · AC-41, FR-L.12: automated CD (CD-1…8) via GitHub OIDC. Runs only when
  # config/env/dev.yaml has delivery_mode: auto (needs federation = not Free Edition).
  deliver:
    name: Deliver to Databricks (dev)
    needs: [build-and-verify, publish]
    if: needs.build-and-verify.outputs.delivery_mode == 'auto'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-dev.yml
    with:
      release_id: ${{ needs.build-and-verify.outputs.release_id }}
