name: CI (PR -> master)

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Validate, compile preview, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Validate DataContracts
        run: uv run mdf validate

      - name: Diff against PR base
        run: uv run mdf diff --base ${{ github.event.pull_request.base.sha }}

      - name: Compile preview
        run: uv run mdf compile --env dev

      - name: Build preview package
        run: uv run mdf package --env dev

      - name: Verify package integrity
        run: uv run mdf verify-package build/dev/release

      - name: Run test suite
        run: uv run pytest

      - name: Upload preview + report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdf-preview-${{ github.run_id }}
          path: |
            build/dev/release
            build/dev/resolved
          retention-days: 7
